name: Build PKHeX-Plugins

on:
  push:
    branches: [ cherrytree ]

env:
  SOLUTION: PKHeX-Plugins.sln
  BUILD_PLATFORM: Any CPU
  BUILD_CONFIGURATION: Release
  DOTNET_VERSION: '10.0.103'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout PKHeX-Plugins
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore NuGet packages for PKHeX-Plugins
      run: dotnet restore ${{ env.SOLUTION }}

    - name: Clone PKHeX repository
      run: git clone -q --depth=5 --branch=master https://github.com/kwsch/PKHeX.git PKHeX

    - name: Restore NuGet packages for PKHeX
      run: dotnet restore PKHeX/PKHeX.sln

    - name: Build PKHeX.Core
      run: dotnet build PKHeX/PKHeX.Core/PKHeX.Core.csproj -c ${{ env.BUILD_CONFIGURATION }} -p:Platform="${{ env.BUILD_PLATFORM }}"

    - name: Copy PKHeX.Core to NuGet cache
      shell: powershell
      run: |
        $pkgDir = "${{ env.USERPROFILE }}\.nuget\packages\pkhex.core"
        if (Test-Path $pkgDir) {
          $nugetver = (Get-ChildItem $pkgDir | Sort-Object -Property LastWriteTime -Descending)[0].Name
          $targetDir = "$pkgDir\$nugetver\lib\net10.0"
          if (-not (Test-Path $targetDir)) { New-Item -ItemType Directory -Path $targetDir -Force | Out-Null }
          Copy-Item "PKHeX\PKHeX.Core\bin\Any CPU\Release\net10.0\PKHeX.Core.dll" $targetDir
        }

    - name: Build PKHeX-Plugins
      run: dotnet build ${{ env.SOLUTION }} -c ${{ env.BUILD_CONFIGURATION }} -p:Platform="${{ env.BUILD_PLATFORM }}"

    - name: Prepare artifacts
      shell: powershell
      run: |
        if (-not (Test-Path bin)) { New-Item -ItemType Directory -Path bin }
        Copy-Item "AutoLegalityMod\bin\Release\net10.0-windows\AutoModPlugins.dll" "bin\"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PKHeX-Plugins
        path: bin/
